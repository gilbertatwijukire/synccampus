<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saagi SyncCampus – Staff</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#7A1426">
<link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/app.css">
</head><body>
<header class="top"><a class="brand" href="/"><span class="logo"><img src="/assets/isbat-logo.png" alt="ISBAT University"></span><span><b>Saagi SyncCampus</b><small>Guild leadership workspace</small></span></a>
  <nav><a href="/">Home</a><span id="who" class="hide" style="color:#F4D7DB;padding:7px 8px"></span><button class="link hide" id="logout">Sign out</button></nav></header>
<main>
<section id="loginBox" class="card" style="max-width:420px;margin:40px auto">
  <h2>Staff sign in</h2><p class="sub">Guild President and cabinet delegates only.</p>
  <form id="loginForm"><label>Email</label><input name="email" type="email" required autocomplete="username">
    <label>Password</label><input name="password" type="password" required autocomplete="current-password">
    <button class="btn" style="margin-top:12px" type="submit">Sign in</button><div class="err" id="loginErr"></div></form>
</section>
<div id="app" class="hide"></div>
</main>
<script src="/config.js"></script><script src="/common.js"></script><script src="/staff.js"></script>
</body></html>
